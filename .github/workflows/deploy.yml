name: Build and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"   # every hour: picks up whatever was added to the Drive folder
  workflow_dispatch: {}     # "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reuse already-resized images
        uses: actions/cache@v4
        with:
          path: .cache
          key: images-${{ github.run_id }}
          restore-keys: images-
      - name: Tools for PDF boards and iPhone photos
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils libheif-examples >/dev/null
      - run: npm install --no-audit --no-fund
      - name: Build from Google Drive (falls back to content/ when the secrets are not set)
        run: node scripts/build.mjs
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Keep a copy of the built site on the snapshot branch (used for previews in Claude)
        run: |
          cd dist
          git init -q -b snapshot
          git config user.name "archive-bot"
          git config user.email "archive-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Snapshot ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" snapshot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
