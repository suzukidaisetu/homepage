<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aga Shunsei</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<meta name="description" content="Works, references and texts by Aga Shunsei.">
<link rel="icon" href="assets/duck/stand_day.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html,body{margin:0}body{font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}
</style>
<style>
/* Layout: one white table. Index sits directly on its left edge; sheets lie square to the table on the right. References open as a grid. */
:root{
  --bg:#ececea;
  --fg:#141414;
  --muted:#8b8a85;
  --line:rgba(20,20,20,.12);
  --line-hi:rgba(20,20,20,.6);
  --sheet:#f4f4f2;
  --chip:#141414;
  --chip-fg:#ffffff;
  --f-body:"Inter","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --f-name:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif;
  --f-mono:"Inter","Hiragino Sans","Noto Sans JP",sans-serif;
  --blue:#2c6bcf;--orange:#f28a1e;--ink:#161616;
  color-scheme:light;
}
body.inv{--bg:#0b0b0b;--fg:#f1f0ec;--muted:#86857f;--line:rgba(241,240,236,.16);--line-hi:rgba(241,240,236,.65);--sheet:#121212;--chip:#f1f0ec;--chip-fg:#0b0b0b;color-scheme:dark}
body{font-variant-numeric:tabular-nums}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden}


.rail{display:flex;flex-direction:column;min-height:0;position:relative;z-index:2}
.rail-head{display:flex;justify-content:space-between;align-items:center;padding:0 0 14px 0;gap:8px}
.tabs{display:flex;flex-wrap:wrap;gap:2px 0;margin-left:-8px}
.tab{display:inline-flex;align-items:center;gap:5px;font:500 11.5px/1 var(--f-body);letter-spacing:.02em;color:var(--muted);background:none;border:0;border-bottom:1px solid transparent;padding:6px 8px 7px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.tab:hover{color:var(--fg)}
.tab:focus-visible{outline:1px solid var(--fg);outline-offset:2px}
.rail-head{align-items:flex-start}
.lang{display:flex;flex:none;border:1px solid var(--line)}
.lang button{font:500 10px/1 var(--f-body);letter-spacing:.06em;color:var(--muted);background:none;border:0;padding:5px 7px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.lang button:focus-visible{outline:1px solid var(--fg);outline-offset:1px}
.rail-head .cnt{font:500 10px/1 var(--f-mono);letter-spacing:.14em;color:var(--muted)}
.list.refs .thumb{aspect-ratio:1/1}
.kind{position:absolute;top:6px;left:6px;font:500 8.5px/1 var(--f-mono);letter-spacing:.12em;padding:3px 5px;background:rgba(255,255,255,.9);color:var(--fg);border:1px solid var(--line-hi)}
.list{list-style:none;margin:0;padding:0 0 24px 0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:0;flex:1;min-height:0;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.item{display:block}
.entry{display:grid;grid-template-columns:34px minmax(0,1fr);gap:6px 8px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:14px 0 18px;cursor:pointer;color:var(--muted);transition:color .25s,border-color .25s}
.entry .eno{grid-row:span 2;font:500 10px/1 var(--f-mono);letter-spacing:.1em;padding-top:6px}
.entry .ettl{font:500 19px/1.18 var(--f-body);letter-spacing:-.01em;text-wrap:balance}
.entry .emeta{display:flex;gap:10px;flex-wrap:wrap;font:400 10px/1.3 var(--f-mono);letter-spacing:.04em}
.entry .emeta span:last-child::after{content:" sheets"}
.entry:hover{color:var(--fg)}
.entry[aria-pressed="true"]{color:var(--fg);border-top-color:var(--fg)}
.entry[aria-pressed="true"] .eno::before{content:"● ";font-size:8px;vertical-align:1px}
.entry:focus-visible{outline:1px solid var(--fg);outline-offset:2px}

.desk{position:relative;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.scroller{position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.canvas{position:relative;isolation:isolate;width:100%}
.head{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;padding-bottom:16px}
.label{pointer-events:none;display:grid;gap:6px;min-width:0}
.label .pno{font:500 10px/1 var(--f-mono);letter-spacing:.14em;color:var(--muted)}
.label h1{margin:0;font:600 22px/1.15 var(--f-body);letter-spacing:.02em}
.label .pmeta{font:400 10.5px/1.4 var(--f-mono);color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{font:500 11px/1 var(--f-body);letter-spacing:.08em;color:var(--fg);background:var(--bg);border:1px solid var(--line);padding:8px 12px;cursor:pointer}
.btn:hover{border-color:var(--line-hi)}
.btn:focus-visible{outline:1px solid var(--fg);outline-offset:2px}
.hint{position:absolute;z-index:3;left:0;bottom:0;padding:4px 6px 0 0;background:var(--bg);font:400 10px/1.4 var(--f-mono);color:var(--muted);letter-spacing:.03em;pointer-events:none}

.sheet{position:absolute;background:var(--sheet);outline:1px solid var(--line);cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none}
.sheet:hover,.sheet.dragging,.sheet:focus-visible{outline-color:var(--line-hi)}
.sheet.dragging{cursor:grabbing}
.sheet.move{transition:left .28s cubic-bezier(.2,.8,.2,1),top .28s cubic-bezier(.2,.8,.2,1),width .28s cubic-bezier(.2,.8,.2,1)}
.sheet.text.move{transition:left .28s cubic-bezier(.2,.8,.2,1),top .28s cubic-bezier(.2,.8,.2,1)}
.sheet img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
.sheet-cap{display:flex;justify-content:space-between;gap:8px;padding:6px 8px 7px;border-top:1px solid var(--line);font:400 9.5px/1.2 var(--f-mono);color:var(--fg);letter-spacing:.03em;white-space:nowrap;overflow:hidden}
.sheet-cap span:first-child{overflow:hidden;text-overflow:ellipsis}
.sheet-cap span:last-child{color:var(--muted)}
.sheet.ref{outline-style:dashed}
/* Text sheets are drawn in white and blended by difference: on the bare table they read as plain dark (or light) text, and wherever they cross an image the letters take the inverse of what lies beneath. */
.canvas{background:var(--bg)}
.sheet.text{background:transparent;outline-color:transparent;mix-blend-mode:difference;--fg:#fff;--muted:rgba(255,255,255,.62)}
.sheet.text:hover,.sheet.text.dragging,.sheet.text:focus-visible{outline-color:rgba(255,255,255,.7)}
.sheet.text .tools button{mix-blend-mode:normal}
body.inv .sheet.text{filter:none}
.tsheet{box-sizing:border-box;padding:calc(var(--u,3px)*7) calc(var(--u,3px)*7) calc(var(--u,3px)*6);display:flex;flex-direction:column;gap:calc(var(--u,3px)*3.4);overflow:hidden;color:var(--fg);pointer-events:none}
.tsheet .tk{font:500 calc(var(--u,3px)*3)/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tsheet h3{margin:0;font:600 max(14px,calc(var(--u,3px)*5))/1.4 var(--f-body);letter-spacing:.01em;text-wrap:balance}
.tsheet p{margin:0;font:500 max(11px,calc(var(--u,3px)*3.1))/1.85 var(--f-body);text-align:justify}
.tsheet .tf{margin-top:calc(var(--u,3px)*2);font:400 calc(var(--u,3px)*2.8)/1 var(--f-body);color:var(--muted)}
body.inv .app[data-mode="works"] .sheet:not(.ref){filter:invert(1) grayscale(.35);opacity:.2}
body.inv .app[data-mode="works"] .sheet:not(.ref):hover{opacity:.5}
.sheet.ref .sheet-cap{background:var(--chip);color:var(--chip-fg);border-top-color:transparent}
.sheet.ref .sheet-cap span:last-child{color:var(--chip-fg);opacity:.6}
.sheet.center{outline:1px solid var(--line-hi)}

.desk.grid-view{overflow:hidden}
.refgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:32px 20px;align-content:start;padding:0 8px 48px 0}
.tile{display:grid;gap:6px;align-content:start;min-width:0}
.tile .frame{display:block;width:100%;aspect-ratio:1/1;max-width:100%;padding:0;border:0;background:var(--sheet);outline:1px solid var(--line);overflow:hidden;cursor:pointer}
.tile .frame:disabled{cursor:default}
.tile img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .35s cubic-bezier(.2,.75,.2,1)}
.tile .frame:not(:disabled):hover img{transform:scale(1.03)}
.tile .frame:hover,.tile .frame:focus-visible{outline-color:var(--line-hi)}
.tmeta{display:flex;justify-content:space-between;font:500 9.5px/1 var(--f-mono);letter-spacing:.12em;color:var(--muted);padding-top:4px}
.tttl{font:600 13px/1.3 var(--f-body)}
.tlinks{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:baseline;font:400 10.5px/1.4 var(--f-mono);color:var(--muted)}
.tlinks .seen{letter-spacing:.06em}
.tagbar{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 22px}
.chip{display:inline-flex;gap:6px;align-items:baseline;font:500 11px/1 var(--f-body);letter-spacing:.04em;color:var(--fg);background:none;border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer}
.chip span{font:400 9.5px/1 var(--f-mono);color:var(--muted)}
.chip:hover{border-color:var(--line-hi)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[aria-pressed="true"] span{color:var(--bg);opacity:.6}
.chip:focus-visible{outline:1px solid var(--fg);outline-offset:2px}
.ttags{display:flex;flex-wrap:wrap;gap:4px 8px;font:400 10px/1.3 var(--f-mono);color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{font:500 10.5px/1 var(--f-body);letter-spacing:.03em;color:var(--fg);text-decoration:none;border:1px solid var(--line-hi);padding:6px 9px}
.links a:hover{background:var(--fg);color:var(--bg)}
.sheet-links{height:26px;box-sizing:border-box;padding:0 8px 6px;background:var(--chip)}
.sheet-links .links a{color:var(--chip-fg);border-color:var(--chip-fg);padding:4px 7px;font-size:9.5px}
.sheet-links .links a:hover{background:var(--chip-fg);color:var(--chip)}
.about{max-width:640px;padding:8px 0 60px;display:grid;gap:18px}
.about .draft{margin:0;font:500 10px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.about p{margin:0;font:400 15px/1.7 var(--f-body)}
.about .lead{font:500 22px/1.4 var(--f-body);letter-spacing:-.01em;text-wrap:balance}
.about dl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:0;margin:18px 0 0;border-top:1px solid var(--line)}
.about dt,.about dd{margin:0;padding:12px 0;border-bottom:1px solid var(--line);font:400 13px/1.5 var(--f-body)}
.about dt{color:var(--muted);font-size:11px;letter-spacing:.06em;padding-top:14px}
.about .muted{color:var(--muted)}
.tab .cc{font-size:9.5px;min-width:16px;padding:2px 4px;box-sizing:border-box;text-align:center;border-radius:999px;background:var(--line);color:var(--fg)}
.tab.bump .cc{animation:bump .5s cubic-bezier(.2,.8,.2,1)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.5);background:var(--fg);color:var(--bg)}100%{transform:scale(1)}}
.tools button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tcollect{justify-self:start;font:500 10.5px/1 var(--f-body);letter-spacing:.03em;color:var(--fg);background:none;border:1px solid var(--line-hi);padding:6px 9px;cursor:pointer}
.tcollect[aria-pressed="true"],.tcollect:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.texts{list-style:none;margin:0;padding:0 0 60px;max-width:760px;border-top:1px solid var(--line)}
.titem{display:grid;grid-template-columns:56px 90px minmax(0,1fr);gap:6px 12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:20px 0 22px;cursor:pointer;color:var(--fg)}
.titem .tno,.titem .tdate{font:400 10.5px/1.6 var(--f-mono);color:var(--muted)}
.titem .tkind{font:400 10.5px/1.6 var(--f-mono);color:var(--muted);grid-column:3}
.titem .tt{grid-column:3;font:500 21px/1.25 var(--f-body);letter-spacing:-.01em;text-wrap:balance}
.titem .tex{grid-column:3;font:400 13px/1.6 var(--f-body);color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:62ch}
.titem:hover .tt{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.titem:focus-visible{outline:1px solid var(--fg);outline-offset:2px}
.titem:first-child{grid-row:1}
.reading{max-width:640px;padding:0 0 60px;display:grid;gap:18px}
.reading p{margin:0;font:400 15px/1.8 var(--f-body)}
.reading .lead{font:500 20px/1.5 var(--f-body);letter-spacing:-.01em}
.backlink{justify-self:start;font:500 11px/1 var(--f-body);color:var(--muted);background:none;border:0;padding:0 0 6px;cursor:pointer}
.backlink:hover{color:var(--fg)}
.trel{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;padding-top:18px;border-top:1px solid var(--line);font:400 11px/1.4 var(--f-mono);color:var(--muted)}
.empty{max-width:520px;padding-top:40px;display:grid;gap:10px}
.empty p{margin:0;font:400 14px/1.7 var(--f-body);color:var(--muted)}
.empty .lead{font:500 22px/1.3 var(--f-body);color:var(--fg)}
:lang(en) .tsheet p{text-align:left}
:lang(ja) .about .lead,:lang(ja) .reading .lead,:lang(ja) .titem .tt,:lang(ja) .tsheet h3{text-wrap:pretty;word-break:auto-phrase}
.plink{text-align:left;font:500 10.5px/1.3 var(--f-mono);color:var(--fg);background:none;border:0;border-bottom:1px solid var(--line-hi);padding:0;cursor:pointer}
.plink:hover{border-bottom-color:var(--fg)}
.plink:focus-visible{outline:1px solid var(--fg);outline-offset:2px}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn:disabled{opacity:.35;cursor:default}
.tools{position:absolute;top:8px;right:8px;display:flex;gap:3px;opacity:0;transition:opacity .15s}
.sheet:hover .tools,.sheet:focus-within .tools{opacity:1}
@media (hover:none){.tools{opacity:.9}}
.tools button{font:500 10.5px/1 var(--f-body);letter-spacing:.02em;padding:6px 9px;border:1px solid var(--fg);background:var(--bg);color:var(--fg);cursor:pointer}
.tools button:hover{background:var(--fg);color:var(--bg)}

@media (max-width:720px){
  .titem{grid-template-columns:48px minmax(0,1fr)}.titem .tdate{display:none}.titem .tkind,.titem .tt,.titem .tex{grid-column:2}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:12px}
  .rail-head{padding:0 0 8px}
  .list{flex-direction:row;overflow-x:auto;overflow-y:visible;padding:0 0 6px;gap:12px}
  .item{flex:0 0 auto;max-width:220px}
  .entry{padding:10px 14px 12px 0}
  .entry .ettl{font-size:15px}
  .label h1{font-size:16px}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){.sheet.move,.thumb,.thumb img{transition:none}}

/* ---- shell shared by all three patterns ---- */
.app{height:100%;box-sizing:border-box;display:grid;gap:0 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.top,.rail,.desk{min-width:0;min-height:0}
.top{grid-area:top;display:none;align-items:center;gap:20px}
.rail{grid-area:rail;display:none;flex-direction:column;gap:18px}
.desk{grid-area:desk}
.slot{display:flex;align-items:center;gap:6px;min-width:0}
.slot.grow{flex:1;min-height:0;align-items:stretch;flex-direction:column}
.slot:empty{display:none}
.corner{position:absolute;z-index:2000001;flex-wrap:wrap}
.corner.tl{top:0;left:0}.corner.tr{top:0;right:0}.corner.bl{bottom:0;left:0}.corner.br{bottom:0;right:0}
.corner.bc{bottom:18px;left:50%;transform:translateX(-50%)}
.brand{font:600 14px/1 var(--f-body);letter-spacing:.01em;color:var(--fg);background:none;border:0;padding:0;cursor:pointer;white-space:nowrap}
.crumb{font:400 14px/1 var(--f-body);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.crumb:not(:empty)::before{content:"/";margin:0 8px;color:var(--line-hi)}
.nav{display:flex;flex-wrap:wrap;gap:2px}
.dhead{padding-bottom:16px}
.label{display:grid;gap:6px;min-width:0}
.lang{display:flex;flex:none;border:1px solid var(--line)}
.btn .cc,.tab .cc{margin-left:6px}

/* B: a site bar on top, the project index on the left, table tools floating at the bottom of the table */
.v-b{grid-template:"top top" auto "rail desk" minmax(0,1fr)/220px minmax(0,1fr);row-gap:22px}
.v-b .top,.v-b .rail{display:flex}
.v-b .top{justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line)}
.v-b #s-top-c{flex:1;justify-content:center}
.v-b .nav{margin-left:-8px}
.v-b:not([data-mode="works"]) .rail{display:none}
.v-b:not([data-mode="works"]) .desk{grid-column:1/-1}
.v-b #s-bc{padding:5px;background:var(--bg);border:1px solid var(--line);box-shadow:0 6px 24px -10px rgba(0,0,0,.35)}
.v-b #s-bc .btn{border-color:transparent}
.v-b .scroller{padding-bottom:70px}

/* C: everything sits on the edges of the table; no tabs, the index is the navigation */
.v-c{grid-template:"rail desk" minmax(0,1fr)/236px minmax(0,1fr);column-gap:72px}
.v-c .rail{display:flex}
.v-c #s-rail-foot{flex-direction:column;align-items:flex-start;gap:12px;padding-top:14px;border-top:1px solid var(--line)}
.v-c #tab-works{display:none}
.v-c .nav{flex-direction:column;align-items:flex-start;gap:0}
.v-c .nav .tab{font-size:15px;padding:5px 0;border:0;letter-spacing:0}
.v-c .nav .tab[aria-selected="true"]{color:var(--fg)}
.v-c .nav .tab[aria-selected="true"]::before{content:"● ";font-size:8px;vertical-align:2px}
.v-c .brand{font-size:16px;padding-bottom:6px}
.v-c .label h1{font-size:18px}
.v-c .label .pno{display:none}
.v-c .dhead{padding-right:180px;padding-bottom:12px}
.v-c .corner .btn{background:var(--bg)}
.v-c .corner .btn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.v-c .corner.bl,.v-c .corner.br{bottom:10px}
.v-c .scroller{padding-bottom:56px}

/* D: the table fills the screen; a name, a few words, and one Index that opens over everything */
.v-d{grid-template:"desk" minmax(0,1fr)/minmax(0,1fr)}
.v-d .dhead{display:block!important;height:46px;padding:0;flex:none}
.v-d .corner.tl,.v-d .corner.tr{height:46px;align-items:center;background:var(--bg)}
.v-d .corner.tl{right:auto;padding-right:16px}
.v-d .corner .btn{border:0;background:none;padding:6px 0 6px 16px;letter-spacing:.02em;font-size:12.5px}
.v-d .corner .btn[aria-pressed="true"]{background:none;color:var(--fg);text-decoration:underline;text-underline-offset:4px}
.v-d #indexBtn{font-weight:600}

.overlay[hidden]{display:none}
.overlay{position:fixed;inset:0;z-index:3000000;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;overflow:auto}
.ovtop{display:flex;justify-content:space-between;align-items:center;padding-bottom:28px}
.ovname{font:600 14px/1 var(--f-body)}
#ov-close{font:600 12.5px/1 var(--f-body);background:none;border:0;color:var(--fg);cursor:pointer;padding:6px 0}
.ovbody{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:40px;max-width:1100px;width:100%}
.ovbody #s-ov-main{flex-direction:column;align-items:stretch}
.overlay .list{overflow:visible}
.overlay .entry .ettl{font-size:clamp(22px,3vw,34px)}
.overlay .entry{grid-template-columns:44px minmax(0,1fr);padding:18px 0 22px}
.ovside{flex-direction:column;align-items:flex-start;gap:18px}
.overlay .nav{flex-direction:column;align-items:flex-start}
.overlay .nav .tab{font-size:20px;padding:6px 0;border:0;letter-spacing:0}

.desk.panel-open.panel-left .scroller{padding-right:0;padding-left:min(440px,44%)}
.sheet .tools button[data-a="note"]{text-transform:none}
.readwrap{display:grid;grid-template-columns:minmax(0,640px) 210px;column-gap:56px;align-items:start;padding-bottom:60px}

.margin{position:relative}

.mnote{position:absolute;top:6px;left:6px;z-index:3;font:500 10.5px/1 var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--fg);padding:5px 8px;cursor:pointer;opacity:0;transition:opacity .15s}
.mfig:hover .mnote,.mfig:focus-within .mnote,.mfig.sel .mnote{opacity:1}
.mnote:hover,.mfig.sel .mnote{background:var(--fg);color:var(--bg)}
.mfig.sel .mimg{outline:1px solid var(--fg);outline-offset:4px}
.v-m .mnote{opacity:1}
.rlink{border-bottom:1px solid var(--line-hi);cursor:pointer;transition:background .2s,color .2s}
.rlink.on,.rlink:focus-visible{background:var(--fg);color:var(--bg);outline:0}
.v-m .readwrap{grid-template-columns:minmax(0,1fr);grid-template-areas:"art" "mg"}
.v-m .rmeta{position:static;margin:4px 0 22px}
.v-m .margin{position:static;display:flex;flex-wrap:wrap;gap:12px;margin-top:28px;min-height:0!important}
.v-m .mfig{position:relative}
.texts .titem{grid-template-columns:132px 84px minmax(0,1fr);align-items:center;gap:6px 18px;padding:14px 0}
.texts .titem .tthumbs{grid-column:1;grid-row:1;display:block;width:132px;aspect-ratio:3/2;background:var(--line);overflow:hidden}
.texts .titem .tthumbs img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1);opacity:.75;transition:filter .3s,opacity .3s}
.texts .titem:hover .tthumbs img{filter:none;opacity:1}
.texts .titem .tdate{grid-column:2;grid-row:1}

.v-m .texts .titem{grid-template-columns:96px minmax(0,1fr);gap:4px 14px}
.v-m .texts .titem .tthumbs{width:96px;grid-row:1/3}
.v-m .texts .titem .tdate{grid-column:2;grid-row:1}
.v-m .texts .titem .tt{grid-column:2;grid-row:2}
.ibox{overflow:hidden;position:relative}

/* text pages, lighter: no rules, quieter weights */
.texts{border-top:0}

/* the name one step lighter */
.brand,.v-a #s-rail-top .brand,.gtitle{font-family:var(--f-name)!important;font-weight:600!important;letter-spacing:-.025em!important}
/* Japanese held a little tighter: proportional kana, a hair of tracking kept */
:lang(ja) body{font-feature-settings:"palt";letter-spacing:.02em}
body{font-feature-settings:"palt","cv11";-webkit-font-smoothing:antialiased}
/* ---- reading a text, after an essay page laid out like fala's: text in the right half, the left half quiet ---- */
.readwrap{grid-template-columns:minmax(0,1fr) minmax(0,680px);grid-template-areas:"mg art";column-gap:56px;padding:4px 0 120px}

.rmeta button{justify-self:start;margin-bottom:10px;font:400 12px/1 var(--f-body);color:var(--muted);background:none;border:0;padding:0;cursor:pointer}

.v-a.reading #s-dhead{display:none}

.v-a[data-mode="text"] .desk.panel-open .scroller{padding-right:0}

.v-m .refpanel{position:fixed;inset:52px 0 0 0;width:auto;padding:14px 16px 60px;border-left:0}
.v-m .desk.panel-open .scroller{padding-right:0}
/* collection: what you keep lines up as tiny icons beside the word */
.minis{display:inline-flex;flex-wrap:wrap;gap:2px;margin-left:8px;max-width:110px;vertical-align:-1px}
.mini{width:9px;height:9px;display:block;object-fit:cover;outline:1px solid var(--line);background:var(--sheet)}

.mini.pop{animation:miniPop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes miniPop{from{transform:scale(2.4)}to{transform:none}}
.minis .more{font:500 9px/9px var(--f-body);color:var(--muted);margin-left:2px}
.flyer{position:fixed;z-index:5500000;pointer-events:none;object-fit:cover;transform-origin:50% 50%;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
/* collection tools: keep as an image, pass on as a link */
.colltools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.colltools .btn{background:var(--bg)}
.colltools .shared{font:500 11px/1 var(--f-body);color:var(--muted);margin-right:4px}
.toast{position:fixed;left:50%;bottom:28px;z-index:5600000;transform:translateX(-50%);background:var(--fg);color:var(--bg);font:500 12px/1 var(--f-body);padding:10px 14px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.imgout{position:fixed;inset:0;z-index:5000001;background:rgba(10,10,10,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
.imgout[hidden]{display:none}
.imgout img{max-width:min(92vw,1100px);max-height:76vh;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#fff}
.imgout .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.imgout a,.imgout button{font:500 12px/1 var(--f-body);color:#141414;background:#fff;border:0;padding:10px 14px;text-decoration:none;cursor:pointer}
.imgout .hint2{font:400 11px/1.4 var(--f-body);color:rgba(255,255,255,.7)}
.imgout .linkbox{font:400 12px/1.4 var(--f-body);color:#fff;background:rgba(255,255,255,.08);padding:10px 12px;max-width:min(92vw,640px);word-break:break-all;user-select:all}
/* ---- A: every word on one bar along the bottom; the index is a thin strip of grey squares on the right ---- */
.v-a{grid-template:"rail desk" minmax(0,1fr) "top top" auto/168px minmax(0,1fr);column-gap:32px;padding-block:16px 0}
.v-a .top{display:flex;align-items:center;gap:24px;height:46px;border-top:1px solid var(--line);font:500 13px/1 var(--f-body)}
.v-a #s-top-l{flex:none;gap:10px}
.v-a #s-top-c{flex:1;min-width:0;gap:14px}
.v-a #s-top-r{flex:none;gap:26px}
.v-a .brand{text-transform:none;font:700 17px/1 var(--f-body);letter-spacing:-.02em}
.v-a .duck{width:24px;height:32px;align-self:center}
.v-a .crumb{display:flex;align-items:baseline;gap:12px;max-width:none;min-width:0;font:500 13px/1 var(--f-body);color:var(--fg)}
.v-a .crumb::before{content:none}
.v-a .crumb .cno{color:var(--muted)}
.v-a .crumb .ct{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v-a .crumb .cm{color:var(--muted);white-space:nowrap}
.v-a .crumb.peek .ct{color:var(--muted)}
.v-a .nav{flex-direction:row;gap:18px;margin:0}
.v-a .nav .tab{font:500 13px/1 var(--f-body);padding:4px 0;border:0;letter-spacing:0;color:var(--muted)}
.v-a .nav .tab[aria-selected="true"],.v-a .nav .tab.lit{color:var(--fg)}
.v-a .btn,.v-a .seg,.v-a .seg button{border:0;background:none;box-shadow:none}
.v-a .btn{font:500 13px/1 var(--f-body);letter-spacing:0;padding:4px 0;color:var(--muted)}
.v-a .btn:hover,.v-a .seg button:hover{color:var(--fg)}
.v-a .btn[aria-pressed="true"]{background:none;color:var(--fg)}
.v-a .seg{gap:12px}
.v-a .seg button{font:500 13px/1 var(--f-body);letter-spacing:0;padding:4px 0;color:var(--muted)}
.v-a .seg button+button{border:0}
.v-a .seg button[aria-pressed="true"]{background:none;color:var(--fg);text-decoration:underline;text-underline-offset:4px}
/* the light switch: a small plate on the table's top-right corner; the duck walks over and flips it */
.v-a #s-tr{top:0;right:0}
.v-a #rel{display:flex;align-items:center;gap:9px;padding:0 0 8px 12px;background:var(--bg);color:var(--fg);font:500 12px/1 var(--f-body)}
.v-a #rel:hover{color:var(--fg)}
.v-a #rel:hover .plate{background:var(--line)}
.swl b{font-weight:700;margin-left:3px}
.plate{position:relative;flex:none;width:20px;height:30px;box-sizing:border-box;border:1.5px solid var(--fg);border-radius:4px;transition:background .2s}
.plate i{position:absolute;left:4px;right:4px;top:4px;height:10px;border-radius:2px;background:var(--fg);transition:top .16s cubic-bezier(.3,1.7,.5,1)}
#rel[aria-pressed="true"] .plate i{top:13px}
#tab-about{display:none!important}
.v-a #s-tl{top:-16px;left:30px}
.v-a #rel{position:relative;display:block;width:64px;height:100px;padding:0;border:0;background:none;color:var(--fg);cursor:pointer}
.v-a #rel .swl{position:absolute;left:50px;top:40px;font:500 11px/1 var(--f-body);white-space:nowrap;color:var(--muted);transition:color .2s}
.v-a #rel:hover .swl,.v-a #rel:focus-visible .swl{color:var(--fg)}
.lamp{display:block;overflow:visible}
.lamp line{stroke:var(--fg);stroke-width:1.2}
.lamp .pull{stroke-width:1}
.lamp .shade,.lamp .bead{fill:var(--fg)}
.lamp .sock{fill:var(--fg)}
.lamp .rim{stroke-width:1.6}
.lamp .rays line{stroke-width:1.1;stroke-linecap:round;transition:opacity .35s}
.lamp .bulb{fill:var(--bg);stroke:var(--fg);stroke-width:1.2;transition:fill .35s}
#rel[aria-pressed="true"] .lamp .rays line{opacity:0}
#rel[aria-pressed="true"] .lamp .bulb{fill:var(--muted);stroke:var(--muted)}
.lampg{transform-box:view-box;transform-origin:26px 0}
.duck .pw,.duck .ps{position:absolute;inset:0}
.duck .pw{display:none}
.duck.flying.up .pw{display:block}
.duck.flying.up .ps{display:none}
/* the dark spreads from the lamp with a soft, wide edge */
html.vt-radial::view-transition-new(root){-webkit-mask-image:radial-gradient(circle at var(--vx) var(--vy),#000 max(0px,calc(var(--vr) - 280px)),transparent var(--vr));mask-image:radial-gradient(circle at var(--vx) var(--vy),#000 max(0px,calc(var(--vr) - 280px)),transparent var(--vr))}
.duck.walk{animation:duckwalk .26s ease-in-out infinite alternate}
@keyframes duckwalk{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-3px) rotate(4deg)}}

.duck.flip{animation:duckflip .3s cubic-bezier(.3,.7,.3,1)}
.v-a .colltools{gap:16px;margin-left:auto}
.v-a .colltools .btn{padding:4px 0}
.v-a .rail{display:flex;flex-direction:column;min-height:0}
.v-a .list{gap:0;padding:0}
.v-a .entry{display:block;padding:0;border:0}
.v-a .entry .eno,.v-a .entry .ettl,.v-a .entry .emeta{display:none}
/* three and a half works fit the height, so the strip reads as a list that continues */
.v-a .entry .ethumb{display:block;width:168px;height:calc((100vh - 64px)/3.5);min-height:120px;aspect-ratio:auto;margin:0;background:var(--line)}

.v-a .entry[aria-pressed="true"] .ethumb{outline:0}

.v-a .dhead{min-height:0;padding:0}
.v-a.reading .dhead{padding-bottom:16px}
.v-a .rail{margin-bottom:0}
.v-a .scroller{padding-bottom:24px}
/* ---- A, revised: the left column is the site; the bar under the table holds only this table's tools ---- */
.v-a{grid-template:"rail desk" minmax(0,1fr) "rail top" auto/224px minmax(0,1fr);column-gap:28px}
.v-a:not([data-mode="works"]){grid-template:"rail" auto "desk" minmax(0,1fr) "top" auto/minmax(0,1fr)}
.v-a:not([data-mode="works"]) .rail{grid-row:auto}

.v-a[data-mode="refs"] .top,.v-a[data-mode="text"] .top,.v-a[data-mode="about"] .top{display:none}
.v-a .rail{grid-row:1/3;gap:0;z-index:2000010}
.v-a #s-rail-foot{display:none}
/* name on one line; the places in one small line under it; the duck walks along that line to wherever you are */
.v-a #s-rail-top{position:relative;display:block;padding:0 0 14px}
.v-a #s-rail-top .brand{display:block;font:700 28px/1 var(--f-body);letter-spacing:-.035em;white-space:nowrap;text-align:left;padding:0}

.v-a .top{gap:20px}
.v-a #s-top-l{flex:1;min-width:0;gap:16px}
.v-a #s-top-r{gap:22px}
/* index: tall images, no gaps, the number always on the image; the open (or pointed) work slides right and shows its name and year turned on its side */
.v-a .entry{position:relative;display:block;width:224px;padding:0;border:0;overflow:hidden}

.v-a #s-rail{margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)))}
.v-a .entry .ethumb{width:196px;height:auto;min-height:0;aspect-ratio:auto;transition:none}
.v-a .entry .ethumb img{height:auto;object-fit:initial}

.v-a .entry .eno{transition:none!important}
.v-a .entry:hover .ethumb,.v-a .entry:hover .eno,.v-a .entry[aria-pressed="true"] .ethumb,.v-a .entry[aria-pressed="true"] .eno{transition:transform .45s cubic-bezier(.2,.8,.2,1)!important}
.v-a .entry .ettl{transition:none!important}
.v-a .entry:hover .ettl,.v-a .entry[aria-pressed="true"] .ettl{transition:opacity .3s .15s!important}

.v-a.home .top{visibility:hidden}

.v-a[data-mode="works"]:not(.home) .scroller{padding-top:84px;box-sizing:border-box}
.v-a .entry .eno{display:block!important;position:absolute;left:8px;top:8px;padding:0;font:700 15px/1 var(--f-body)!important;letter-spacing:-.02em;color:#fff!important;opacity:1!important;mix-blend-mode:difference;pointer-events:none;transition:transform .45s cubic-bezier(.2,.8,.2,1)}

.eyr{display:none}
.minis:empty{display:none}
/* the page itself also gets the class "reading" while a text is open; keep it from taking the article's narrow width */
.app.reading{max-width:none;padding-top:16px;padding-bottom:16px;gap:0 28px}
.app.v-a.reading{padding-bottom:0;column-gap:22px}
.app.v-m.reading{padding-block:0}

<div class="app v-b" id="app">

  <main class="desk" id="desk" aria-label="Table">
    <div class="slot dhead" id="s-dhead"></div>
    <div class="scroller" id="scroller"></div>
    <div class="slot corner tl" id="s-tl"></div><div class="slot corner tr" id="s-tr"></div>
    <div class="slot corner bl" id="s-bl"></div><div class="slot corner br" id="s-br"></div>
    <div class="slot corner bc" id="s-bc"></div>
    <aside class="refpanel" id="refpanel" hidden aria-label="Reference"></aside>
    <section class="drawer" id="drawer" aria-label="Collection">
      <div class="dtop"><span>Collection <span id="drawer-n">0</span></span><span class="dnote">Kept in this browser</span><button type="button" id="drawer-close">Close</button></div>
      <div class="ditems" id="drawer-items"></div>

  </main>
  <div class="overlay" id="overlay" hidden role="dialog" aria-label="Index">
    <div class="ovtop"><span class="js-name ovname">Aga Shunsei</span><button type="button" id="ov-close">Close</button></div>
    <div class="ovbody"><div class="slot" id="s-ov-main"></div><div class="slot ovside" id="s-ov-side"></div></div>

const DUCK=(function(){

/* Sizes with a clear hierarchy: one lead image, then a random mix of large, medium and small. */
function sizeAll(els,r,lead=true){const w=W(),narrow=w<620;
  const opts=narrow?[.92,.8,.7]:[.34,.3,.27,.24],wts=narrow?[2,3,3]:[2,3,3,2];
  const pick=()=>{let s=wts.reduce((a,b)=>a+b),x=r()*s;for(let k=0;k<opts.length;k++){x-=wts[k];if(x<=0)return opts[k]}return opts[opts.length-1]};
  els.forEach((el,k)=>{let f=lead&&k===0?(narrow?1:.42):pick();if(el._ar<1)f*=Math.sqrt(el._ar)*1.1;
    let ww=f*w*(.92+r()*.16);ww=Math.min(ww,(VH()*.88-el._cap)*el._ar,w);if(el._text)ww=Math.min(w,Math.max(narrow?w*.8:260,Math.min(ww,380)));setW(el,ww)})}
/* Random collage: each sheet drops to the highest free spot at a random x, so the table grows downward with irregular gaps. */
function collage(els,r){const W0=W(),w=W0<620?W0:W0*.78,placed=[];
  const hit=(x,y,ww,hh)=>placed.some(p=>x<p.x+p.w+G&&x+ww+G>p.x&&y<p.y+p.h+G&&y+hh+G>p.y);
  els.forEach(el=>{const ww=el._w,hh=hOf(el);let best=null;
    for(let s=0;s<18;s++){const x=s===0?0:s===1?Math.max(0,w-ww):r()*Math.max(0,w-ww);
      const ys=[0,...placed.map(p=>p.y+p.h+G)].sort((a,b)=>a-b);
      for(const y0 of ys){const y=y0+(y0?r()*28:0);if(!hit(x,y,ww,hh)){if(!best||y<best.y-6||(Math.abs(y-best.y)<=6&&r()<.5))best={x,y};break}}}
    placed.push({x:best.x,y:best.y,w:ww,h:hh,el});raise(el)});
  /* centre the whole group on the table: across, and down too when it is shorter than the view */
  let x0=1e9,x1=-1e9,y1=0;placed.forEach(p=>{x0=Math.min(x0,p.x);x1=Math.max(x1,p.x+p.w);y1=Math.max(y1,p.y+p.h)});
  const dx=(W0-(x1-x0))/2-x0,dy=Math.max(0,(VH()-y1)/2-8);
  placed.forEach(p=>{p.el.style.left=p.x+dx+'px';p.el.style.top=p.y+dy+'px'});
  grow()}
function rowsFor(els,t,w,g){const rows=[];let row=[],sum=0;
  els.forEach(el=>{row.push(el);sum+=el._ar;if(sum*t+g*(row.length-1)>=w){rows.push({row,h:(w-g*(row.length-1))/sum});row=[];sum=0}});
  if(row.length)rows.push({row,h:Math.min((w-g*(row.length-1))/sum,t*1.5)});return rows}
function arrange(els){const w=W(),g=10,t=Math.min(VH()*.42,w/2.4);let y=0;
  rowsFor(els,t,w,g).forEach(({row,h})=>{let x=0;row.forEach(el=>{animate(el);setW(el,h*el._ar);el.classList.remove('big');el.style.left=x+'px';el.style.top=y+'px';x+=h*el._ar+g});y+=h+Math.max(...row.map(e=>e._cap))+g});grow()}

/* White to black (and back) as a slow, even dimming, like lights going off. */
let VR_OK=false;try{CSS.registerProperty({name:'--vr',syntax:'<length>',inherits:false,initialValue:'0px'});VR_OK=true}catch(e){VR_OK=!!(window.CSS&&CSS.registerProperty)&&String(e).includes('already')}
function invert(on,origin,update){const run=()=>{document.body.classList.toggle('inv',on);update&&update()};
  if(document.body.classList.contains('inv')===on||reduce||!document.startViewTransition){run();return}
  const vt=document.startViewTransition(run);
  vt.ready.then(()=>{if(origin&&VR_OK){const de=document.documentElement,r=Math.hypot(Math.max(origin.x,innerWidth-origin.x),Math.max(origin.y,innerHeight-origin.y))+280;
      de.style.setProperty('--vx',origin.x+'px');de.style.setProperty('--vy',origin.y+'px');de.classList.add('vt-radial');
      de.animate({'--vr':['0px',r+'px']},{duration:1150,easing:'cubic-bezier(.4,0,.25,1)',fill:'both',pseudoElement:'::view-transition-new(root)'});
      de.animate({opacity:[1,1]},{duration:1150,fill:'both',pseudoElement:'::view-transition-old(root)'});vt.finished.finally(()=>de.classList.remove('vt-radial'));return}
    if(origin){const r=Math.hypot(Math.max(origin.x,innerWidth-origin.x),Math.max(origin.y,innerHeight-origin.y));
      document.documentElement.animate({clipPath:[`circle(0px at ${origin.x}px ${origin.y}px)`,`circle(${r}px at ${origin.x}px ${origin.y}px)`]},{duration:900,easing:'cubic-bezier(.45,0,.2,1)',fill:'both',pseudoElement:'::view-transition-new(root)'});
      document.documentElement.animate({opacity:[1,1]},{duration:900,fill:'both',pseudoElement:'::view-transition-old(root)'});return}
    const o={duration:1300,easing:'cubic-bezier(.45,0,.25,1)',fill:'both'};
    document.documentElement.animate({opacity:[0,1]},{...o,pseudoElement:'::view-transition-new(root)'});
    document.documentElement.animate({opacity:[1,1]},{...o,pseudoElement:'::view-transition-old(root)'})}).catch(()=>{})}

function moveDuck(x,y,spot,done){const d=$('duck');x=Math.max(0,x);const x0=parseFloat(d.style.left),y0=parseFloat(d.style.top);
  clearTimeout(d._mt);clearInterval(d._flap);d.classList.remove('walk','flying','up');
  if(isNaN(x0)||reduce||d._spot==null){d.style.transitionDuration='0ms';d.style.left=x+'px';d.style.top=y+'px';d._spot=spot;requestAnimationFrame(()=>requestAnimationFrame(()=>d.style.transitionDuration=''));done&&done();return}
  const dist=Math.hypot(x-x0,y-y0);if(dist<2){d._spot=spot;done&&done();return}

  const end=()=>{d.classList.remove('walk','flying','up');clearInterval(d._flap);d.style.transitionDuration='';d.style.transitionTimingFunction='';done&&done()};
  if(fly){const t=Math.round(Math.min(1150,620+dist*.9));d.style.transitionDuration=t+'ms';d.style.transitionTimingFunction='cubic-bezier(.45,0,.3,1)';

(function(){const g=$('gate'),film=$('gfilm'),cap=$('gcap'),frames=P.flatMap((p,i)=>p.sheets.map(s=>({img:s.img,t:p.title,n:p.no})));let f=0,gone=false;
